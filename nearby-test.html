<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- OpenStreetMap only serves map pictures to pages that say where they are from -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Optional: Options Near By (map test)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dangrek&family=Caveat:wght@600&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>


:root{
  --oat:#ECE4D5; --paper:#F7F2E9; --ink:#34302A; --slate:#2C3E4A;
  --red:#A02020; --button:#A4532A; --button-press:#8C4522; --green:#4F5C3A;
}
*{box-sizing:border-box;}
html{font-size:100%;}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  background:#DDD0BA; color:var(--ink);
  font-family:'Nunito', system-ui, sans-serif; font-size:1.0625rem; line-height:1.5;
  display:flex; justify-content:center;
}
.app{
  width:100%; max-width:28rem; min-height:100vh; min-height:100dvh;
  background:
    radial-gradient(circle at 0% 0%, rgba(168,94,103,0.30) 0%, rgba(168,94,103,0) 55%),
    radial-gradient(circle at 100% 0%, rgba(224,162,78,0.34) 0%, rgba(224,162,78,0) 55%),
    radial-gradient(circle at 0% 100%, rgba(224,162,78,0.34) 0%, rgba(224,162,78,0) 55%),
    radial-gradient(circle at 100% 100%, rgba(168,94,103,0.30) 0%, rgba(168,94,103,0) 55%),
    linear-gradient(160deg, #EFE6D6 0%, #E4D8C3 100%);
  display:flex; flex-direction:column;
}
.screen{
  flex:1; display:flex; flex-direction:column; gap:1.5rem;
  padding:2rem 1.5rem 1.75rem;
}
.screen[hidden]{display:none;}

.tagline{
  margin:0; text-align:center;
  font-family:'Caveat', cursive; font-weight:600; font-size:1.75rem; line-height:1.2; color:var(--slate);
}
.couch{display:block; width:100%; max-width:22rem; height:auto; margin:0 auto;}
.couch.small{max-width:11rem;}

h1{
  margin:0; font-family:'Dangrek', system-ui, sans-serif; font-weight:400;
  font-size:2rem; line-height:1.3; text-wrap:balance; text-align:center;
}
h1 .line{display:block;}
h1 .opt{color:var(--red);}

.body{margin:0; font-size:1.0625rem; text-align:center;}
.hero{flex:1; display:flex; flex-direction:column; justify-content:center; gap:1.5rem;}
.note{margin:0; font-family:'Caveat', cursive; font-weight:600; font-size:1.5rem; line-height:1.3; color:var(--green);}

.actions{margin-top:auto; display:flex; flex-direction:column; gap:0.5rem;}
.btn{
  min-height:3.5rem; width:100%; border:none; border-radius:1.75rem;
  background:var(--button); color:var(--paper);
  font-family:inherit; font-size:1.1875rem; font-weight:700; cursor:pointer;
}
.btn:hover{background:var(--button-press);}
.btn:active{background:var(--button-press);}
.link{
  min-height:2.75rem; width:100%; border:none; background:none; color:var(--ink);
  font-family:inherit; font-size:1.0625rem; font-weight:700; text-decoration:underline; cursor:pointer;
}
.link:hover{color:var(--red);}
:focus-visible{outline:0.1875rem solid var(--slate); outline-offset:0.1875rem;}

.private{
  margin:0; display:flex; align-items:center; justify-content:center; gap:0.5rem;
  font-size:1rem; text-align:center;
}
.private svg{flex-shrink:0;}

label{display:block; margin-bottom:0.75rem; text-align:center;}
label.plain{margin:0;}
.hint{display:block;}
.back{
  align-self:flex-start; width:2.75rem; height:2.75rem; margin:-0.75rem 0 -1rem -0.5rem;
  border:none; background:none; color:var(--ink); border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.back:hover{color:var(--red);}
#meet .hero, #you .hero{gap:1.25rem;}
#meet .actions{margin-top:0.5rem;}
input[type="text"]{
  width:100%; min-height:3.25rem; padding:0.75rem 1rem;
  border:0.125rem solid var(--ink); border-radius:0.75rem; background:#fff; color:var(--ink);
  font-family:inherit; font-size:1.0625rem; text-align:center;
}
.confirm{margin:0; font-weight:700; font-size:1.1875rem;}
.preview-note{
  margin:0; padding:1rem; border-radius:0.75rem; background:var(--paper); font-size:1rem; text-align:center;
}

.center{text-align:center;}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
#more .hero, #signup .hero, #key .hero, #login .hero{gap:1.25rem;}
.choices{display:flex; flex-direction:column; gap:0.75rem;}
.choice{
  min-height:3.5rem; width:100%; padding:0.75rem 1rem; text-align:left;
  border:0.125rem solid var(--ink); border-radius:0.875rem; background:var(--paper); color:var(--ink);
  font-family:inherit; font-size:1.125rem; font-weight:700; cursor:pointer;
}
.choice:hover{background:#fff;}
.choice span{display:inline-block; width:1.75rem;}
.field{display:flex; flex-direction:column;}
.flabel{font-weight:700; text-align:left; margin-bottom:0.375rem;}
.field input, .pw input{text-align:left;}
input[type="email"], input[type="password"]{
  width:100%; min-height:3.25rem; padding:0.75rem 1rem;
  border:0.125rem solid var(--ink); border-radius:0.75rem; background:#fff; color:var(--ink);
  font-family:inherit; font-size:1.0625rem;
}
.pw{position:relative;}
.pw input{padding-right:5rem;}
.show{
  position:absolute; right:0.25rem; top:50%; transform:translateY(-50%);
  min-width:4rem; min-height:2.75rem; border:none; background:none; color:var(--ink);
  font-family:inherit; font-size:1rem; font-weight:700; text-decoration:underline; cursor:pointer;
}
.hintline{margin:0.375rem 0 0; font-size:1rem;}
.error{margin:0.375rem 0 0; font-size:1rem; font-weight:700; color:#8A1C1C;}
.error:empty{display:none;}
.error.center{text-align:center;}
.btn:disabled{opacity:0.7; cursor:progress;}
#login-note:empty{display:none;}
.error::before{content:"! "; }
input[aria-invalid="true"]{border-color:#8A1C1C; border-width:0.1875rem;}
.keybox{
  padding:1.25rem 1rem; border-radius:0.875rem; background:var(--paper); border:0.125rem solid var(--ink);
  display:flex; flex-direction:column; align-items:center; gap:0.75rem;
}
.keytext{
  margin:0; font-family:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size:1.25rem; font-weight:700; letter-spacing:0.05em; text-align:center; word-spacing:0.25em; line-height:1.6;
}
.copy{
  min-height:2.75rem; padding:0.5rem 1.25rem; border:0.125rem solid var(--ink); border-radius:1.5rem;
  background:none; color:var(--ink); font-family:inherit; font-size:1.0625rem; font-weight:700; cursor:pointer;
}
.copy:hover{background:#fff;}
#copy-status:empty{display:none;}
.check{display:flex; align-items:center; gap:0.75rem; min-height:2.75rem; margin:0; text-align:left; font-weight:700; cursor:pointer;}
.check input{width:1.5rem; height:1.5rem; flex-shrink:0; accent-color:var(--button);}

@media (prefers-reduced-motion: no-preference){
  .screen:not([hidden]){animation:fade 0.25s ease;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
}

/* ================= HOME (mockup) ================= */
.home{flex:1; display:flex; flex-direction:column; gap:1.1rem; padding:1rem 1.5rem 7rem;}
.topbar{display:flex; align-items:center; justify-content:space-between;}
.iconbtn{width:2.75rem; height:2.75rem; border:none; background:none; color:var(--ink); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-left:-0.5rem;}
.wordmark{margin:0; font-family:'Dangrek', system-ui, sans-serif; font-size:1.375rem; letter-spacing:0.03em; color:var(--red);}
.spacer{width:2.25rem;}
.home h1{font-size:1.75rem; text-align:center;}
.quote{margin:-0.75rem 0 0; text-align:center; font-family:'Caveat', cursive; font-weight:600; font-size:1.375rem; color:var(--green);}
.sechead{display:flex; align-items:center; justify-content:space-between; gap:0.5rem; margin-top:0.25rem;}
.sechead h2{margin:0; font-family:'Caveat', cursive; font-weight:600; font-size:1.625rem; line-height:1.1;}
.pill{min-height:2.75rem; padding:0.4rem 1rem; border:0.125rem solid var(--ink); border-radius:1.5rem; background:none; color:var(--ink); font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer;}
.strips{display:flex; flex-direction:column; gap:0.75rem; filter:drop-shadow(0 0.18rem 0.25rem rgba(52,48,42,0.32));}
.strip{
  position:relative; width:100%; border:none; color:var(--ink); cursor:pointer; font-family:inherit;
  background-color:#FAF4E8;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.32  0 0 0 0 0.22  0 0 0 0.38 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), linear-gradient(180deg, #FDF9F1 0%, #F5EBDA 100%);
}
.strip:focus-visible{outline:0.1875rem solid var(--slate); outline-offset:-0.5rem;}
.strip.event{padding:0.9rem 1rem 0.9rem 1.1rem; text-align:left; display:block;}
.strip.event .ev-name{display:block; font-size:1.0625rem; font-weight:700; line-height:1.3;}
.strip.event .ev-meta{display:block; font-size:1rem; line-height:1.4;}
.strip.event .ev-tags{display:block; font-size:1rem; line-height:1.4; color:#4A5637; font-weight:700;}
.strip.nav{min-height:3.75rem; padding:1rem 2.75rem; display:flex; align-items:center; justify-content:center; text-align:center; font-size:1.125rem; font-weight:700;}
.strip.nav::before{content:""; position:absolute; left:1.1rem; top:50%; transform:translateY(-50%); width:1rem; height:1rem; border-radius:50%; box-shadow:0 0.15rem 0.2rem rgba(0,0,0,0.4); background:radial-gradient(circle at 35% 35%, #8fc98f, #4a7d4a);}
.strip.nav.pink::before{background:radial-gradient(circle at 35% 35%, #e88f9a, #a83a4a);}
.strip.nav.blue::before{background:radial-gradient(circle at 35% 35%, #7fb3e0, #2c6ca3);}
.seeall{align-self:center; margin-top:-0.4rem;}
.sample{margin:0; text-align:center; font-size:1rem;}

/* ---- the Friend's bar: one-line journal, fixed to the bottom of every page ---- */
.friendbar-wrap{position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none;
  background:linear-gradient(180deg, rgba(228,216,195,0) 0%, rgba(226,212,190,0.96) 38%);}
.friendbar{pointer-events:auto; position:relative; width:100%; max-width:28rem; padding:1.1rem 1.5rem 1.1rem;}
.friendbar .inner{position:relative; filter:drop-shadow(0 0.25rem 0.35rem rgba(52,48,42,0.3));}
.friendbar input{
  display:block; width:100%; min-height:3.5rem; padding:0.5rem 3.6rem 0.5rem 1.3rem; text-align:left;
  border:none; border-radius:0.7rem; color:var(--ink);
  background-color:#E6CE9C;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0 0.10  0 0 0 0.62 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), radial-gradient(ellipse at 50% 45%, rgba(246,230,188,0.85) 0%, rgba(246,230,188,0) 65%), linear-gradient(180deg, #EAD4A4 0%, #DBBE88 100%);
  box-shadow:inset 0 0 0.9rem rgba(110,72,28,0.4);
  font-family:'Caveat', cursive; font-weight:600; font-size:1.4rem;
}
.friendbar input::placeholder{color:var(--ink); opacity:0.82;}
.friendbar .inner::before{content:""; position:absolute; inset:0.35rem; z-index:1; pointer-events:none; border:0.09rem dashed rgba(96,62,28,0.7); border-radius:0.45rem;}
.friendbar .send{position:absolute; right:0.45rem; top:50%; transform:translateY(-50%); z-index:2; width:2.6rem; height:2.6rem; border:none; border-radius:50%; background:var(--button); color:var(--paper); cursor:pointer; display:flex; align-items:center; justify-content:center;}

/* ================= clickable mockup additions ================= */
.page{flex:1; display:flex; flex-direction:column; gap:1.1rem; padding:1rem 1.5rem 7rem;}
.page[hidden]{display:none;}
.page h1{font-size:1.75rem; text-align:center;}
#more.page{padding-bottom:2rem;}
#more h1{font-size:2rem;}
.strip.nav.red::before{background:radial-gradient(circle at 35% 35%, #f08a8a, #c0392b);}
.strip.nav.amber::before{background:radial-gradient(circle at 35% 35%, #e0b878, #b0842f);}
.strips.five{gap:0.875rem;}
.stub{margin:0; padding:1rem; border-radius:0.75rem; background:rgba(247,242,233,0.7); text-align:center; font-size:1rem;}

/* big journal box (the "more of" page and the Friend's page) */
.bigbox{position:relative; margin-top:0.75rem; filter:drop-shadow(0 0.25rem 0.35rem rgba(52,48,42,0.3));}
.bigbox textarea{
  display:block; width:100%; min-height:8rem; resize:none; padding:1.25rem 3.75rem 1rem 1.4rem;
  border:none; border-radius:0.7rem; color:var(--ink);
  background-color:#E6CE9C;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0 0.10  0 0 0 0.62 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"), radial-gradient(ellipse at 50% 45%, rgba(246,230,188,0.85) 0%, rgba(246,230,188,0) 65%), linear-gradient(180deg, #EAD4A4 0%, #DBBE88 100%);
  box-shadow:inset 0 0 1.2rem rgba(110,72,28,0.4);
  font-family:'Caveat', cursive; font-weight:600; font-size:1.4rem; line-height:1.6;
}
.bigbox textarea::placeholder{color:var(--ink); opacity:0.82;}
.bigbox::before{content:""; position:absolute; inset:0.45rem; z-index:1; pointer-events:none; border:0.09rem dashed rgba(96,62,28,0.7); border-radius:0.45rem;}
.bigbox .send{position:absolute; right:0.9rem; bottom:0.9rem; z-index:2; width:2.75rem; height:2.75rem; border:none; border-radius:50%; background:var(--button); color:var(--paper); cursor:pointer; display:flex; align-items:center; justify-content:center;}

/* chat bubbles on the Friend's page */
.thread{display:flex; flex-direction:column; gap:0.75rem;}
.bubble{max-width:85%; margin:0; padding:0.75rem 1rem; border-radius:1rem; font-size:1.0625rem;}
.bubble.friend{align-self:flex-start; background:var(--paper); border-bottom-left-radius:0.25rem;}
.bubble.me{align-self:flex-end; background:var(--button); color:var(--paper); border-bottom-right-radius:0.25rem;}

/* menu drawer */
.scrim{position:fixed; inset:0; background:rgba(52,48,42,0.5); z-index:20;}
.drawer{position:fixed; top:0; bottom:0; left:0; z-index:21; width:min(20rem, 86vw); padding:1.25rem 1.25rem 2rem;
  background:linear-gradient(160deg, #EFE6D6 0%, #E4D8C3 100%); box-shadow:0.4rem 0 1.2rem rgba(52,48,42,0.35);
  display:flex; flex-direction:column; gap:1rem; overflow-y:auto;}
.scrim[hidden], .drawer[hidden]{display:none;}
.drawer .head{display:flex; align-items:center; justify-content:space-between;}

/* map preview on Home */
.mapcard{position:relative; display:block; width:100%; height:8.5rem; padding:0; border:none; border-radius:0.6rem; overflow:hidden; cursor:pointer; background:#EDE3CF;
  box-shadow:0 0.2rem 0.5rem rgba(52,48,42,0.28), inset 0 0 0 0.0625rem rgba(138,106,79,0.3);}
.mapcard svg{display:block; width:100%; height:100%;}
.mapcard .tap{position:absolute; right:0.6rem; bottom:0.6rem; padding:0.3rem 0.8rem; border-radius:1rem; background:var(--ink); color:var(--paper); font-size:1rem; font-weight:700;}

/* coming-soon bits */
.soon{position:absolute; right:0.9rem; top:50%; transform:translateY(-50%); padding:0.1rem 0.55rem; border-radius:0.75rem; background:var(--ink); color:var(--paper); font-size:0.875rem; font-weight:700;}
.strip.nav.has-soon{padding-right:4.25rem;}
.notice{margin:0; padding:0.9rem 1rem; border-radius:0.75rem; background:var(--ink); color:var(--paper); text-align:center; font-size:1.0625rem; font-weight:700;}
.strip.nav.off{cursor:default;}
.strip.nav.off .lbl2{opacity:0.8;}
.campfire-card{margin:0; padding:1.1rem 1rem; border-radius:0.6rem; background:var(--ink); color:var(--paper); text-align:center;}
.campfire-card strong{display:block; font-family:'Dangrek', system-ui, sans-serif; font-weight:400; font-size:1.375rem;}
.campfire-card span{font-family:'Caveat', cursive; font-weight:600; font-size:1.25rem;}

/* ================= NEARBY (test page) ================= */
.page{padding-bottom:2.5rem;}
#map{height:17rem; border-radius:0.6rem; overflow:hidden; background:#EDE3CF; box-shadow:0 0.2rem 0.5rem rgba(52,48,42,0.28), inset 0 0 0 0.0625rem rgba(138,106,79,0.3); z-index:0;}
.maphelp{margin:0; padding:1rem; text-align:center;}
.pin{width:1.5rem; height:1.5rem; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--red); border:0.15rem solid var(--paper); box-shadow:0 0.15rem 0.3rem rgba(0,0,0,0.4);}
.pin.on{background:var(--button); width:1.9rem; height:1.9rem;}
.youdot{width:1.1rem; height:1.1rem; border-radius:50%; background:#2C6CA3; border:0.2rem solid #fff; box-shadow:0 0 0 0.3rem rgba(44,108,163,0.3);}
.leaflet-popup-content{font-family:'Nunito', system-ui, sans-serif; font-size:1rem; color:var(--ink); margin:0.75rem 1rem;}
.leaflet-popup-content strong{display:block; font-size:1.0625rem;}
.row{display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;}
.chips{display:flex; flex-wrap:wrap; gap:0.5rem;}
.chip{min-height:2.75rem; padding:0.4rem 0.9rem; border:0.125rem solid var(--ink); border-radius:1.5rem; background:none; color:var(--ink); font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer;}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper);}
.chip[aria-pressed="true"]::before{content:"\2713\00a0";}
.status{margin:0; font-size:1rem; text-align:center;}
.strip.place{padding:0.9rem 1rem 0.9rem 1.1rem; text-align:left; display:block;}
.strip.place .ev-name{display:block; font-size:1.0625rem; font-weight:700; line-height:1.3;}
.strip.place .ev-meta{display:block; font-size:1rem; line-height:1.4;}
.strip.place .ev-tags{display:block; font-size:1rem; line-height:1.4; color:#4A5637; font-weight:700;}
.strip.place.on{background-color:#fff; background-image:none;}

.testnote{margin:0; padding:0.9rem 1rem; border-radius:0.75rem; background:var(--ink); color:var(--paper); text-align:center; font-size:1rem;}

<body>
<main class="app">
  <section class="page" aria-labelledby="near-title">
    <div class="topbar">
      <a class="iconbtn" href="./" aria-label="Back to the app">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <p class="wordmark">Optional</p>
      <span class="spacer"></span>
    </div>
    <h1 id="near-title">Options Near By</h1>
    <p class="quote">&ldquo;Take what you need, leave the rest.&rdquo;</p>
    <p class="testnote">Map test. These are practice places in New York City.</p>

    <div id="map" role="region" aria-label="Map of places. The same places are listed below."><p class="maphelp" id="maphelp">Loading the map&hellip;</p></div>

    <div class="row" style="justify-content:center;">
      <button type="button" class="pill" id="locate">Use my location</button>
      <button type="button" class="pill" id="reset">Show all of NYC</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <div class="sechead"><h2>Filter by vibe</h2></div>
    <div class="chips" id="chips" role="group" aria-label="Filter by vibe">
      <button type="button" class="chip" data-tag="Free" aria-pressed="false">Free</button>
      <button type="button" class="chip" data-tag="$" aria-pressed="false">$</button>
      <button type="button" class="chip" data-tag="Indoor" aria-pressed="false">Indoor</button>
      <button type="button" class="chip" data-tag="Outdoor" aria-pressed="false">Outdoor</button>
      <button type="button" class="chip" data-tag="Family" aria-pressed="false">Family-friendly</button>
      <button type="button" class="chip" data-tag="Meetup" aria-pressed="false">Meetup</button>
    </div>

    <div class="sechead"><h2 id="count">Places</h2></div>
    <div class="strips" id="list"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// =========================================================
// OPTIONAL — Options Near By (map test)
// The places are listed right here for now. Later they move
// into a "places" table in Supabase so you can edit them
// without touching code.
// The user's location never leaves the phone. Distances are
// worked out on the device.
// =========================================================
(function(){
  var PLACES = [
    { name: 'Central Park',                 where: 'Manhattan, 59th to 110th St',        when: 'Open daily',            lat: 40.7829, lng: -73.9654, tags: ['Free','Outdoor','Family'] },
    { name: 'Bryant Park',                  where: 'Midtown, behind the library',        when: 'Open daily',            lat: 40.7536, lng: -73.9832, tags: ['Free','Outdoor','Meetup'] },
    { name: 'New York Public Library',      where: 'Main branch, 5th Ave at 42nd St',    when: 'Check hours',           lat: 40.7532, lng: -73.9822, tags: ['Free','Indoor'] },
    { name: 'The High Line',                where: 'West Side, Gansevoort to 34th St',   when: 'Open daily',            lat: 40.7480, lng: -74.0048, tags: ['Free','Outdoor'] },
    { name: 'Little Island',                where: 'Pier 55, Hudson River Park',         when: 'Open daily',            lat: 40.7420, lng: -74.0102, tags: ['Free','Outdoor','Family'] },
    { name: 'Washington Square Park',       where: 'Greenwich Village',                  when: 'Open daily',            lat: 40.7308, lng: -73.9973, tags: ['Free','Outdoor','Meetup'] },
    { name: 'Union Square Greenmarket',     where: 'Union Square',                       when: 'Several days a week',   lat: 40.7359, lng: -73.9911, tags: ['$','Outdoor','Family'] },
    { name: 'Staten Island Ferry',          where: 'Whitehall Terminal, Lower Manhattan', when: 'Runs all day',         lat: 40.7013, lng: -74.0132, tags: ['Free','Outdoor'] },
    { name: 'Brooklyn Bridge Park',         where: 'Brooklyn waterfront',                when: 'Open daily',            lat: 40.7003, lng: -73.9967, tags: ['Free','Outdoor','Family'] },
    { name: 'Brooklyn Public Library',      where: 'Central Library, Grand Army Plaza',  when: 'Check hours',           lat: 40.6722, lng: -73.9682, tags: ['Free','Indoor','Family'] },
    { name: 'Prospect Park',                where: 'Brooklyn',                           when: 'Open daily',            lat: 40.6602, lng: -73.9690, tags: ['Free','Outdoor','Family'] },
    { name: 'Chelsea Market',               where: '9th Ave at 15th St',                 when: 'Open daily',            lat: 40.7424, lng: -74.0061, tags: ['$','Indoor'] }
  ];
  var NYC = { lat: 40.7359, lng: -73.9911, zoom: 12 };

  var map = null, markers = [], youMarker = null;
  var you = null;              // the user's spot, kept only in this page's memory
  var active = [];             // tags switched on
  var selected = -1;

  function $(id){ return document.getElementById(id); }

  // ---------- distance, worked out on the phone ----------
  function miles(aLat, aLng, bLat, bLng){
    var rad = Math.PI / 180, R = 3958.8;
    var dLat = (bLat - aLat) * rad, dLng = (bLng - aLng) * rad;
    var h = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(aLat*rad) * Math.cos(bLat*rad) * Math.sin(dLng/2) * Math.sin(dLng/2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function visiblePlaces(){
    var out = [];
    for (var i = 0; i < PLACES.length; i++){
      var p = PLACES[i], ok = true;
      for (var t = 0; t < active.length; t++){ if (p.tags.indexOf(active[t]) === -1){ ok = false; break; } }
      if (ok){ out.push({ index: i, place: p, dist: you ? miles(you.lat, you.lng, p.lat, p.lng) : null }); }
    }
    if (you){ out.sort(function(a, b){ return a.dist - b.dist; }); }
    return out;
  }

  // ---------- the list (also the screen-reader version of the map) ----------
  function renderList(){
    var items = visiblePlaces();
    var list = $('list');
    list.innerHTML = '';
    $('count').textContent = items.length === 1 ? '1 place' : items.length + ' places';
    if (items.length === 0){
      var none = document.createElement('p');
      none.className = 'empty';
      none.textContent = 'Oops, nothing matches. Try fewer filters.';
      list.appendChild(none);
    }
    for (var i = 0; i < items.length; i++){
      (function(item, n){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'strip place tear' + (n % 6) + (item.index === selected ? ' on' : '');
        var name = document.createElement('span'); name.className = 'ev-name'; name.textContent = item.place.name;
        var meta = document.createElement('span'); meta.className = 'ev-meta';
        meta.textContent = item.place.where + ' \u00b7 ' + item.place.when + (item.dist !== null ? ' \u00b7 ' + (item.dist < 10 ? item.dist.toFixed(1) : Math.round(item.dist)) + ' mi away' : '');
        var tags = document.createElement('span'); tags.className = 'ev-tags'; tags.textContent = item.place.tags.join(' \u00b7 ');
        b.appendChild(name); b.appendChild(meta); b.appendChild(tags);
        b.addEventListener('click', function(){ choose(item.index, true); });
        list.appendChild(b);
      })(items[i], i);
    }
    // show or hide pins to match
    if (map){
      var shown = {};
      for (var k = 0; k < items.length; k++){ shown[items[k].index] = true; }
      for (var m = 0; m < markers.length; m++){
        if (shown[m]){ if (!map.hasLayer(markers[m])){ markers[m].addTo(map); } }
        else if (map.hasLayer(markers[m])){ map.removeLayer(markers[m]); }
      }
    }
  }

  function pinIcon(on){
    return L.divIcon({ className: '', html: '<div class="pin' + (on ? ' on' : '') + '"></div>', iconSize: [24, 24], iconAnchor: [12, 24], popupAnchor: [0, -22] });
  }

  function choose(index, moveMap){
    selected = index;
    if (map){
      for (var m = 0; m < markers.length; m++){ markers[m].setIcon(pinIcon(m === index)); }
      if (moveMap){ map.flyTo([PLACES[index].lat, PLACES[index].lng], 15); }
      markers[index].openPopup();
      if (moveMap){ $('map').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }
    renderList();
  }

  // ---------- the map ----------
  function startMap(){
    if (!window.L){
      $('maphelp').textContent = "The map couldn't load. The places are still listed below.";
      return;
    }
    $('map').innerHTML = '';
    map = L.map('map', { scrollWheelZoom: false }).setView([NYC.lat, NYC.lng], NYC.zoom);
    var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    // If the street pictures fail to arrive, say so instead of showing a blank map.
    var failed = 0, loaded = 0;
    tiles.on('tileload', function(){ loaded++; });
    tiles.on('tileerror', function(){
      failed++;
      if (failed >= 3 && loaded === 0){
        $('status').textContent = "The street map didn't load, so only the pins are showing. The places are all listed below.";
      }
    });
    for (var i = 0; i < PLACES.length; i++){
      (function(i){
        var p = PLACES[i];
        var holder = document.createElement('div');
        var strong = document.createElement('strong'); strong.textContent = p.name;
        var line = document.createElement('span'); line.textContent = p.where + ' \u00b7 ' + p.tags.join(' \u00b7 ');
        holder.appendChild(strong); holder.appendChild(line);
        var marker = L.marker([p.lat, p.lng], { icon: pinIcon(false), title: p.name, alt: p.name }).addTo(map).bindPopup(holder);
        marker.on('click', function(){ choose(i, false); });
        markers.push(marker);
      })(i);
    }
  }

  // ---------- location ----------
  $('locate').addEventListener('click', function(){
    var status = $('status');
    if (!navigator.geolocation){ status.textContent = "This phone can't share a location. Showing all of NYC."; return; }
    status.textContent = 'Finding you\u2026';
    navigator.geolocation.getCurrentPosition(function(pos){
      you = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      status.textContent = 'Sorted by what is closest to you. Your location stays on this phone.';
      if (map){
        if (youMarker){ map.removeLayer(youMarker); }
        youMarker = L.marker([you.lat, you.lng], { icon: L.divIcon({ className: '', html: '<div class="youdot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), title: 'You are here', alt: 'You are here', interactive: false }).addTo(map);
        map.flyTo([you.lat, you.lng], 13);
      }
      renderList();
    }, function(){
      status.textContent = "No problem. Location is off, so here's all of NYC.";
    }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
  });

  $('reset').addEventListener('click', function(){
    you = null; selected = -1; $('status').textContent = '';
    if (map){
      if (youMarker){ map.removeLayer(youMarker); youMarker = null; }
      for (var m = 0; m < markers.length; m++){ markers[m].setIcon(pinIcon(false)); markers[m].closePopup(); }
      map.flyTo([NYC.lat, NYC.lng], NYC.zoom);
    }
    renderList();
  });

  // ---------- filters ----------
  var chips = document.querySelectorAll('.chip');
  for (var c = 0; c < chips.length; c++){
    chips[c].addEventListener('click', function(){
      var tag = this.getAttribute('data-tag');
      var at = active.indexOf(tag);
      if (at === -1){ active.push(tag); this.setAttribute('aria-pressed', 'true'); }
      else { active.splice(at, 1); this.setAttribute('aria-pressed', 'false'); }
      renderList();
    });
  }

  startMap();
  renderList();
})();
</script>
</body>
</html>
